# Keeps every pull request's status labels up to date (pnpm labels:prs, issues #97/#98):
# stackpile and one of waiting-on.author / .review / .merge. See "Labels" in CLAUDE.md.
#
# - Every 10 minutes (GitHub may delay scheduled runs by a few minutes), and on demand: all PRs.
# - On PR and review events: just that PR, so labels change within a minute.
#
# Security: pull_request_target runs this workflow as it is on main, with a token that can write labels,
# also for PRs from forks. It checks out main (the default for pull_request_target), never the PR's code,
# and only reads PR metadata through the API, so a PR cannot change what runs here.
# Owner: platform team.
name: PR labels

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]

concurrency:
  group: pr-labels-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: update PR labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A review on a fork's PR only gets a read-only token; the next scheduled run labels it instead.
    if: github.event_name != 'pull_request_review' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The labeller has no dependencies, so there is no install step. The PR number comes from the
      # event through an env var, never from the PR's own text.
      - name: Update labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            node server/tooling/workflow/pr-labels.mjs --number "$PR_NUMBER"
          else
            node server/tooling/workflow/pr-labels.mjs
          fi
