# Shared start of every CI job: pnpm, Node and the workspace's dependencies.
# The job checks out the repository first (a local action can't run before the checkout).
name: Set up the workspace
description: Install pnpm and Node from the repo's pins, then the dependencies from the lockfile.
runs:
  using: composite
  steps:
    # Version comes from "packageManager" in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
