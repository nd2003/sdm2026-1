<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Loop Escape — CCTV Match Preview v11</title>
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: #0c0a14;
  color: #f8fafc;
}

.tle-root {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 680px;
  width: 100%;
  background: #0c0a14;
  color: #f1f5f9;
  overflow: hidden;
  user-select: none;
}

/* ================= TOP HEADER BAR ================= */
.tle-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 62px;
  padding: 0 22px;
  background: linear-gradient(180deg, #0d0b18 0%, #151226 100%);
  border-bottom: 1px solid rgba(168, 85, 247, 0.28);
  flex-shrink: 0;
  z-index: 20;
}

.tle-header-left,
.tle-header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.tle-icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(30, 25, 52, 0.85);
  border: 1.5px solid rgba(167, 139, 250, 0.45);
  color: #e2e8f0;
  font-size: 1.05rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
  transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}

.tle-icon-btn:hover {
  transform: translateY(-1px);
  border-color: #c084fc;
  box-shadow: 0 0 16px rgba(192, 132, 252, 0.45);
}

.tle-lobby-corner-btn {
  padding: 6px 13px;
  border-radius: 9px;
  background: rgba(127, 29, 29, 0.35);
  border: 1.5px solid rgba(248, 113, 113, 0.55);
  color: #fecaca;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}

.tle-lobby-corner-btn:hover {
  background: rgba(185, 28, 28, 0.55);
  transform: translateY(-1px);
}

.tle-corner-loop-badge {
  background: rgba(88, 28, 135, 0.55);
  border: 1.5px solid #c084fc;
  color: #f3e8ff;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  padding: 5px 12px;
  border-radius: 9px;
  box-shadow: 0 0 14px rgba(168, 85, 247, 0.35);
}

.tle-players-bar {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.tle-player-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.76rem;
  font-weight: 700;
  color: #f8fafc;
  background: rgba(24, 20, 42, 0.9);
  border: 1px solid rgba(148, 163, 184, 0.35);
  cursor: pointer;
}

.tle-player-you {
  border-color: rgba(74, 222, 128, 0.55);
}

.tle-player-friend {
  border-color: rgba(56, 189, 248, 0.55);
}

.tle-p-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.tle-dot-you {
  background: #4ade80;
  box-shadow: 0 0 8px #4ade80;
}

.tle-dot-friend {
  background: #38bdf8;
  box-shadow: 0 0 8px #38bdf8;
}

.tle-diff-group {
  display: inline-flex;
  background: rgba(20, 16, 36, 0.9);
  border: 1px solid rgba(168, 85, 247, 0.4);
  border-radius: 999px;
  padding: 2px;
  gap: 2px;
}

.tle-diff-btn {
  background: transparent;
  border: none;
  color: #cbd5e1;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
}

.tle-diff-btn.tle-diff-active {
  background: linear-gradient(135deg, #7c3aed, #6d28d9);
  color: #ffffff;
  box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
}

.tle-header-center {
  display: flex;
  align-items: center;
  gap: 16px;
}

.tle-title-line {
  width: 72px;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(192, 132, 252, 0.7), transparent);
}

.tle-title-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tle-loop-emblem {
  position: absolute;
  width: 54px;
  height: 54px;
  color: rgba(168, 85, 247, 0.55);
  filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6));
  pointer-events: none;
}

.tle-title {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.55rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: #f8fafc;
  text-shadow: 0 0 16px rgba(192, 132, 252, 0.65);
}

.tle-timer-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 18px;
  border-radius: 999px;
  background: rgba(24, 18, 43, 0.9);
  border: 1.5px solid #a855f7;
  box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #f8fafc;
  font-variant-numeric: tabular-nums;
}

.tle-timer-pill.tle-timer-urgent {
  border-color: #ef4444;
  color: #fca5a5;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
}

.tle-ctrl-btn {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  border: 1.5px solid rgba(167, 139, 250, 0.5);
  background: rgba(30, 25, 52, 0.9);
  color: #f8fafc;
  transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}

.tle-ctrl-btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.tle-ctrl-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.tle-ctrl-start {
  background: linear-gradient(135deg, #16a34a, #15803d);
  border-color: #4ade80;
  box-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
}

.tle-ctrl-start.tle-ctrl-restart-mode {
  background: linear-gradient(135deg, #d97706, #b45309);
  border-color: #fbbf24;
  box-shadow: 0 0 14px rgba(251, 191, 36, 0.45);
}

.tle-ctrl-stop {
  background: rgba(153, 27, 27, 0.8);
  border-color: #f87171;
}

.tle-ctrl-restart {
  background: rgba(88, 28, 135, 0.75);
  border-color: #c084fc;
}

/* ================= MAIN ILLUSTRATED ROOM STAGE ================= */
.tle-stage-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 16px;
  background: #08060e;
  overflow: hidden;
}

.tle-room-stage {
  position: relative;
  width: 100%;
  max-width: 1220px;
  height: 600px;
  min-height: 540px;
  max-height: 680px;
  border-radius: 16px;
  border: 1.5px solid rgba(168, 85, 247, 0.35);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
  overflow: hidden;
  background: #1c1824;
}

/* Room Back Wall, Left Perspective Wall & Wooden Floor */
.tle-wall-back {
  position: absolute;
  inset: 0 0 24% 18%;
  background: radial-gradient(circle at 42% 45%, #352f44 0%, #221d2d 60%, #16131f 100%);
  border-bottom: 4px solid #120e17;
}

.tle-wall-left {
  position: absolute;
  top: 0;
  bottom: 20%;
  left: 0;
  width: 20%;
  background: linear-gradient(90deg, #161422 0%, #252036 100%);
  border-right: 2px solid #13101c;
  z-index: 2;
}

.tle-floor {
  position: absolute;
  inset: 76% 0 0 0;
  background: linear-gradient(180deg, #231710 0%, #160e09 100%);
  border-top: 3px solid #38251a;
  z-index: 1;
}

/* Rainy Night Window & Venetian Blinds */
.tle-window-frame {
  position: absolute;
  top: 7%;
  left: 10%;
  width: 78%;
  height: 62%;
  border: 6px solid #2b1d14;
  border-radius: 4px;
  overflow: hidden;
  background: #0b192c;
  box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.8), 6px 10px 28px rgba(0, 0, 0, 0.6);
}

.tle-window-sky {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #0b1528 0%, #162e4d 65%, #0f2138 100%);
}

.tle-rain-layer {
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    105deg,
    transparent 0px,
    transparent 12px,
    rgba(147, 197, 253, 0.22) 12px,
    rgba(147, 197, 253, 0.22) 13px
  );
}

.tle-window-blinds {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    180deg,
    rgba(43, 29, 20, 0.88) 0px,
    rgba(43, 29, 20, 0.88) 6px,
    transparent 6px,
    transparent 16px
  );
}

.tle-ivy-left {
  position: absolute;
  top: 2%;
  left: 2%;
  font-size: 2.2rem;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
  pointer-events: none;
}

/* Warm or UV Lamp Light Cone */
.tle-lamp-cone {
  position: absolute;
  top: 28%;
  left: 12%;
  width: 340px;
  height: 290px;
  background: radial-gradient(ellipse at 32% 20%, rgba(251, 191, 36, 0.26) 0%, transparent 70%);
  pointer-events: none;
  z-index: 4;
  transition: opacity 0.25s ease, background 0.3s ease;
}

.tle-uv-room .tle-lamp-cone {
  width: 650px;
  height: 420px;
  background: radial-gradient(ellipse at 35% 25%, rgba(168, 85, 247, 0.38) 0%, transparent 75%);
}

.tle-lamp-off .tle-lamp-cone {
  opacity: 0.05;
}

.tle-uv-wall-secret {
  position: absolute;
  top: 7%;
  left: 52%;
  font-family: "Courier New", monospace;
  font-size: 0.82rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  color: #e879f9;
  text-shadow: 0 0 12px #a855f7;
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.tle-uv-room .tle-uv-wall-secret {
  opacity: 1;
}

.tle-fuse-spark {
  position: absolute;
  bottom: 8px;
  right: 8px;
  font-size: 1.1rem;
  filter: drop-shadow(0 0 8px #facc15);
}

/* Feedback & Reset Toasts (z-index 95 so it is NEVER behind modals!) */
.tle-feedback-toast {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 12, 28, 0.96);
  border: 1.5px solid #c084fc;
  color: #f8fafc;
  padding: 7px 18px;
  border-radius: 999px;
  font-size: 0.84rem;
  font-weight: 600;
  z-index: 95;
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.75);
  white-space: nowrap;
  pointer-events: none;
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.tle-toast-reset {
  position: absolute;
  top: 48px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(185, 28, 28, 0.94);
  border: 1px solid #fca5a5;
  color: #ffffff;
  padding: 8px 20px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 700;
  z-index: 25;
}

/* ================= 1. BLUE MOUNTAIN PAINTING & WALL SAFE ================= */
.tle-painting-zone {
  position: absolute;
  top: 15%;
  left: 25%;
  width: 136px;
  height: 174px;
  z-index: 5;
}

.tle-wall-safe {
  position: absolute;
  inset: 14px;
  background: #0d0b14;
  border: 3px solid #334155;
  border-radius: 6px;
  box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
}

.tle-safe-key-btn {
  background: rgba(251, 191, 36, 0.14);
  border: 1.5px solid #fbbf24;
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: #fde68a;
  box-shadow: 0 0 16px rgba(251, 191, 36, 0.45);
}

.tle-svg-key {
  width: 42px;
  height: 42px;
}

.tle-key-sparkle {
  font-size: 0.7rem;
  font-weight: 700;
}

.tle-painting-btn {
  position: absolute;
  inset: 0;
  padding: 7px;
  background: linear-gradient(135deg, #5c3a21, #382212);
  border: 2px solid rgba(255, 255, 255, 0.78);
  border-radius: 6px;
  box-shadow: 0 0 16px rgba(192, 132, 252, 0.45), 0 10px 24px rgba(0, 0, 0, 0.65);
  cursor: pointer;
  transition: transform 0.35s ease, box-shadow 0.2s ease;
}

.tle-painting-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 0 22px rgba(96, 165, 250, 0.75);
}

.tle-painting-btn.tle-painting-open {
  transform: translateX(-82px) rotate(-6deg);
}

.tle-painting-svg {
  width: 100%;
  height: 100%;
  border: 2px solid #93c5fd;
  display: block;
}

.tle-painting-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid #60a5fa;
  color: #bfdbfe;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
}

.tle-cursor-hint {
  position: absolute;
  bottom: 8px;
  right: 8px;
  font-size: 1.25rem;
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
}

/* ================= 2. WOODEN DOUBLE-DOOR CABINET ================= */
.tle-cabinet-zone {
  position: absolute;
  top: 14%;
  left: 42%;
  width: 162px;
  height: 62%;
  z-index: 5;
}

.tle-cabinet-ivy {
  position: absolute;
  top: -14px;
  left: -8px;
  font-size: 1.45rem;
  z-index: 7;
  pointer-events: none;
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.7));
}

.tle-cabinet-btn {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 0;
  background: linear-gradient(180deg, #4a2816 0%, #321a0d 100%);
  border: 3px solid #241208;
  border-radius: 4px 4px 0 0;
  box-shadow: -8px 10px 28px rgba(0, 0, 0, 0.75);
  cursor: pointer;
  overflow: hidden;
  transition: box-shadow 0.2s ease;
}

.tle-cabinet-btn:hover {
  box-shadow: 0 0 20px rgba(251, 191, 36, 0.35), -8px 10px 28px rgba(0, 0, 0, 0.75);
}

.tle-cabinet-top-trim {
  height: 14px;
  background: #2b150a;
  border-bottom: 2px solid #1a0c05;
}

.tle-cabinet-doors {
  position: absolute;
  inset: 14px 6px 6px 6px;
  display: flex;
  gap: 3px;
  z-index: 3;
  transition: transform 0.35s ease, opacity 0.35s ease;
}

.tle-cabinet-open .tle-cabinet-doors {
  transform: scaleX(0.18);
  opacity: 0.25;
}

.tle-cabinet-door {
  flex: 1;
  background: linear-gradient(180deg, #542e19 0%, #3d2010 100%);
  border: 2px solid #261309;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 8px;
  position: relative;
}

.tle-door-panel {
  height: 44%;
  border: 2px solid #2b150a;
  background: rgba(0, 0, 0, 0.15);
}

.tle-cabinet-interior {
  position: absolute;
  inset: 20px 12px 12px 12px;
  background: #140b06;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fde68a;
  font-size: 0.8rem;
  font-weight: 700;
  z-index: 1;
}

.tle-glow-badge {
  position: absolute;
  top: 44%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 1.4rem;
  filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
  z-index: 6;
}

/* ================= 3. CORKBOARD & 1998 PHOTOGRAPH ================= */
.tle-corkboard-btn {
  position: absolute;
  top: 14%;
  left: 61%;
  width: 175px;
  height: 140px;
  background: #7c4d2b;
  border: 6px solid #422512;
  border-radius: 4px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.65);
  cursor: pointer;
  z-index: 5;
  padding: 8px;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.tle-corkboard-btn:hover {
  transform: scale(1.04);
  box-shadow: 0 0 20px rgba(251, 191, 36, 0.45);
}

.tle-polaroid {
  position: absolute;
  top: 10px;
  left: 12px;
  width: 88px;
  background: #f1f5f9;
  padding: 5px 5px 3px 5px;
  transform: rotate(-3deg);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
}

.tle-pin {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ef4444;
  margin: 0 auto 3px auto;
}

.tle-building-svg {
  width: 100%;
  height: 46px;
  display: block;
}

.tle-polaroid-caption {
  font-family: "Courier New", monospace;
  font-size: 0.78rem;
  font-weight: 800;
  color: #1e293b;
  text-align: center;
  margin-top: 2px;
}

.tle-sticky {
  position: absolute;
  width: 26px;
  height: 26px;
  background: #eab308;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
}

.tle-sticky-1 {
  top: 18px;
  right: 16px;
  transform: rotate(4deg);
}

.tle-sticky-2 {
  bottom: 14px;
  right: 16px;
  transform: rotate(-3deg);
}

.tle-sticky-3 {
  bottom: 12px;
  left: 22px;
  transform: rotate(5deg);
}

/* ================= 4. COMPUTER DESK & LOCKED MONITOR ================= */
.tle-computer-desk-zone {
  position: absolute;
  top: 43%;
  left: 58%;
  width: 230px;
  height: 36%;
  z-index: 6;
}

.tle-monitor-btn {
  position: absolute;
  top: 0;
  left: 42px;
  width: 132px;
  height: 92px;
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
}

.tle-monitor-screen {
  width: 100%;
  height: 78px;
  background: linear-gradient(180deg, #0f1b3d 0%, #091026 100%);
  border: 2.5px solid #e2e8f0;
  border-radius: 8px;
  box-shadow: 0 0 18px rgba(147, 197, 253, 0.45);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.tle-monitor-btn:hover .tle-monitor-screen {
  border-color: #38bdf8;
  box-shadow: 0 0 24px rgba(56, 189, 248, 0.75);
}

.tle-monitor-screen.tle-monitor-unlocked {
  border-color: #4ade80;
  box-shadow: 0 0 22px rgba(74, 222, 128, 0.65);
}

.tle-monitor-screen.tle-monitor-unpowered {
  background: #090a10;
  border-color: #475569;

  opacity: 0.75;
}

.tle-monitor-lock {
  font-size: 1rem;
}

.tle-monitor-passbox {
  border: 1px solid rgba(226, 232, 240, 0.75);

  padding: 2px 12px;
  font-size: 0.78rem;
  letter-spacing: 0.16em;
  color: #f8fafc;
}

.tle-monitor-stand {
  width: 34px;
  height: 10px;
  background: #64748b;
  margin: 0 auto;
  border-radius: 0 0 4px 4px;
}

.tle-pencil-cup {
  position: absolute;
  top: 56px;
  left: 16px;
  font-size: 1.1rem;
  pointer-events: none;
}

.tle-right-desk {
  position: absolute;
  top: 86px;
  left: 0;
  right: 0;
  height: 16px;
  background: linear-gradient(180deg, #6b3e23, #4a2916);
  border-radius: 3px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
}

.tle-desk-leg {
  position: absolute;
  top: 16px;
  width: 10px;
  height: 92px;
  background: #3d2212;
}

.tle-leg-l {
  left: 12px;
}

.tle-leg-r {
  right: 12px;
}

/* ================= 5. PANELED EXIT DOOR + 3D PORTAL (Far Right) ================= */
.tle-door-zone {
  position: absolute;
  top: 18%;
  right: 4%;
  width: 138px;
  height: 58%;
  padding: 8px;
  background: #14111d;
  border-radius: 4px 4px 0 0;
  z-index: 5;
  perspective: 750px;
}

.tle-door-portal-Light {
  position: absolute;
  inset: 8px;
  border-radius: 4px;
  border: 2px solid #fde047;
  background: radial-gradient(circle at 50% 45%, #fde047 0%, #c084fc 45%, #3b0764 100%);
  box-shadow: inset 0 0 28px rgba(250, 204, 21, 0.8), 0 0 24px rgba(250, 204, 21, 0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  cursor: pointer;
}

.tle-portal-cyber {

    const clamped = Math.max(0, Math.floor(seconds));

    return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;

        state.keyCollected &&
        state.cabinetUnlocked &&
        state.photoInspected &&
        state.codeEntered

    if (state.difficulty === "medium") {

    return (
      state.r3BreakerSolved &&
      state.r3HoloSolved &&

  /** 5 - 4 - 3 - 2 - 1 - GO! Countdown */
  function startFiveSecondCountdown() {
    readyLobbyModal?.classList.add("hidden");
    countdownOverlay?.classList.remove("hidden");
    let count = 5;
    state.countdownSeconds = count;
    if (countdownNumberEl) {
      countdownNumberEl.textContent = String(count);
    }
    renderState();

    if (countdownIntervalId !== null) {
      window.clearInterval(countdownIntervalId);
    }
    countdownIntervalId = window.setInterval(() => {
      count -= 1;
      if (count > 0) {
        if (countdownNumberEl) {
          countdownNumberEl.textContent = String(count);
        }
      } else if (count === 0) {
        if (countdownNumberEl) {
          countdownNumberEl.textContent = "GO";
        }
      } else {
        if (countdownIntervalId !== null) {
          window.clearInterval(countdownIntervalId);
          countdownIntervalId = null;
        }
        countdownOverlay?.classList.add("hidden");
        state.countdownSeconds = null;
        state.matchStarted = true;
        state.timeLeftSeconds = 60;
        state.timerRunning = true;
        callbacks.onMatchStart?.();
        renderState();
      }
    }, 850);
  }

          `<circle cx="210" cy="35" r="10" fill="${targetFill}" stroke="#22d3ee" stroke-width="2" />` +
          `<text x="102" y="24" fill="#94a3b8" font-size="10">M1</text>` +
          `<text x="82" y="120" fill="#94a3b8" font-size="10">M2</text>` +
          `<text x="224" y="120" fill="#94a3b8" font-size="10">M3</text>` +
          `<text x="203" y="39" fill="#0f172a" font-size="11" font-weight="bold">🎯</text>` +
          `</svg>` +
          `<div class="tle-mirror-controls">` +
          `<button type="button" class="tle-mirror-btn" data-mirror-idx="0">M1 [${mirrorChar(m0)}]</button>` +
          `<button type="button" class="tle-mirror-btn" data-mirror-idx="1">M2 [${mirrorChar(m1)}]</button>` +
          `<button type="button" class="tle-mirror-btn" data-mirror-idx="2">M3 [${mirrorChar(m2)}]</button>` +
          `</div>` +
          `</div>`,
      );

      const mBtns = inspectorBody?.querySelectorAll("[data-mirror-idx]");
      if (mBtns) {
        for (const btn of mBtns) {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.mirrorIdx ?? "0");
            const nextAngles = [...state.r3MirrorAngles];
            nextAngles[idx] = nextAngles[idx] === 0 ? 1 : 0;
            state.r3MirrorAngles = nextAngles;

            if (
              nextAngles[0] === 1 &&
              nextAngles[1] === 1 &&
              nextAngles[2] === 0 &&
              !state.r3LaserSolved
            ) {
              state.r3LaserSolved = true;
              addInventoryItem("Quantum Keycard");
              addClue("DECRYPTED: CORE_FREQ = 2026");
              if (isCurrentRoomAllSolved()) {
                state.doorUnlocked = true;
              }
              renderState();
            }
            renderLaserModal();
          });
        }
      }
    };

    renderLaserModal();
  }

  /** Transitions to a room while keeping total loop count and permanent neural clues! */
  function transitionToRoom(diff, resetTotalLoops = false) {
    const viewport = container.querySelector("#game-viewport");
    if (viewport) {

    state = {
      ...state,

      difficulty: diff,
      timeLeftSeconds: 60,
      loopDurationSeconds: 60,
      loopCount: resetTotalLoops ? 1 : state.loopCount,
      timerRunning: true,
      loopExpired: false,
      escaped: false,
      activeItem: null,
      lampOn: true,
      bookRead: false,
      paintingClicks: 0,
      keyRevealed: false,
      keyCollected: false,
      cabinetUnlocked: false,
      photoInspected: false,
      codeEntered: false,
      r2GramophoneRead: false,
      r2WordInput: [],
      r2TableSolved: false,
      r2BooksSequence: [],
      r2BooksSolved: false,
      r2BooksError: "",
      r2DialValues: [10, 25, 40],
      r2VaultSolved: false,
      r2VaultError: "",

      r3BreakerSolved: false,
      r3HoloInput: [],
      r3HoloSolved: false,
      r3HoloError: "",

      r3LaserSolved: false,
      r3LaserError: "",
      r3CoreUnlocked: false,
      doorUnlocked: false,
      clues: resetTotalLoops ? [] : state.clues,
      inventory: [],
    };
    loopEndModal?.classList.add("hidden");
    pauseModal?.classList.add("hidden");
    inspectorModal?.classList.add("hidden");
    callbacks.onDifficultyChange?.(diff);
    flashRoomBanner(ROOM_TITLES[diff]);
    renderState();
  }

  function stepThroughOpenDoor() {
    const finishedRoomNum =
      state.difficulty === "basic" ? 1 : state.difficulty === "medium" ? 2 : 3;
    showGreenEscapeBanner(`✨ ${state.player1Name} escaped Room ${finishedRoomNum}`);
    callbacks.onEscape?.(state.loopCount, state.difficulty);

    if (state.difficulty === "basic") {
      transitionToRoom("medium", false);
    } else if (state.difficulty === "medium") {
      transitionToRoom("hard", false);
    } else {
      state.escaped = true;
      state.timerRunning = false;
      showScoreboardModal();
    }
  }

  function handleObjectClick(objectId) {
    if (!state.timerRunning && !state.escaped) {
      state.timerRunning = true;
    }
    state.selectedObjectId = objectId;

    switch (objectId) {
      // ==================== ROOM 1 ====================
      case "window":
        flashFeedbackToast("ENV_VIEWPORT_00 // Rain streaks across reinforced glass.");
        break;

      case "lamp":
        state.lampOn = !state.lampOn;
        break;

      case "book":
        state.bookRead = true;
        addClue("DECRYPTED: AZURE_PULSE x4");
        if (isCurrentRoomAllSolved()) state.doorUnlocked = true;
        openInspector(
          "OBJ_LOGBOOK_00 // TACTICAL SCAN",
          `<div class="tle-zoom-card">` +
            `<p class="tle-zoom-sub">Surface scan detected scratched tally marks:</p>` +
            `<p class="tle-zoom-handwriting"><strong>|||| — AZURE_PULSE x4</strong></p>` +
            `</div>`,
        );
        break;

      case "painting":
        if (!state.keyRevealed) {
          state.paintingClicks += 1;
          if (state.paintingClicks >= 4) {
            state.keyRevealed = true;
          }
        }
        break;

      case "key":
        if (state.keyRevealed && !state.keyCollected) {
          state.keyCollected = true;
          addInventoryItem("Golden Key");
          if (isCurrentRoomAllSolved()) state.doorUnlocked = true;
        }
        break;

      case "cabinet":
        if (state.keyCollected) {
          state.cabinetUnlocked = true;
          addClue("DECRYPTED: SCAN_ARCHIVE_03_YEAR");
          if (isCurrentRoomAllSolved()) state.doorUnlocked = true;
          openInspector(
            "SEC_LOCKER_02 // DECRYPTED LOG",
            `<div class="tle-zoom-card">` +
              `<p class="tle-zoom-handwriting">"Cross-reference ARCHIVE_FRAME_03 timestamp year"</p>` +
              `</div>`,
          );
        } else {
          flashFeedbackToast("🔒 SEC_LOCKER_02 // Physical key required");
        }
        break;

      case "photo":
        state.photoInspected = true;
        addClue("NEURAL_LOG: ARCHIVE_YEAR = 1998");
        if (isCurrentRoomAllSolved()) state.doorUnlocked = true;
        openInspector(
          "ARCHIVE_FRAME_03 // METADATA SCAN",
          `<div class="tle-zoom-card">` +
            `<p class="tle-zoom-sub">Etched micro-serial uncovered on frame reverse:</p>` +
            `<div class="tle-zoom-photo-year">🏛️ <span>1998</span></div>` +
            `</div>`,
        );
        break;

      case "computer":
        if (!state.codeEntered) {
          openInspector("CONSOLE_TERMINAL // KEYPAD", "", true);
        }
        break;

      case "door":
        if (isCurrentRoomAllSolved()) {
          stepThroughOpenDoor();
        } else {
          flashFeedbackToast("🔒 Locked — Solve all puzzles to escape");
        }
        break;

      // ==================== ROOM 2 ====================
      case "r2-gramophone":
        state.r2GramophoneRead = true;
        addClue("DECRYPTED: CRYO_CIPHER = M-E-T-I");
        openInspector(
          "ACOUSTIC_LOG_01 // FREQUENCY TRACE",
          `<div class="tle-zoom-card">` +
            `<p class="tle-zoom-handwriting">"I have no voice, yet I tick away every loop.<br/>` +
            `Align the 4 cryo-tiles on CRYO_MATRIX_02: <strong>M - E - T - I</strong>"</p>` +
            `</div>`,
        );
        break;

      case "r2-coffee-table":
        openCoffeeTableLetterPuzzle();
        break;

      case "r2-bookshelf":
        openBookshelfPuzzle();
        break;

      case "r2-vault":
        openRotaryVaultPuzzle();
        break;

      case "r2-door":
        if (isCurrentRoomAllSolved()) {
          stepThroughOpenDoor();
        } else {
          flashFeedbackToast("🔒 Locked — Solve all puzzles to escape");
        }
        break;

      // ==================== ROOM 3 ====================
      case "r3-breaker":
        openCircuitBreakerPuzzle();
        break;

      case "r3-holo-table":
        openHoloTablePuzzle();
        break;

      case "r3-laser-grid":
        openLaserMirrorPuzzle();
        break;

      case "r3-cryo-core":
        if (!state.r3CoreUnlocked) {
          const hintLine = state.r3LaserSolved
            ? `<p class="tle-zoom-sub"><em>Laser Sensor Code: 2026</em></p>`
            : `<p class="tle-zoom-sub"><em>Bounce the Laser Grid into 🎯 to reveal the 4-digit code</em></p>`;
          openInspector("🧬 Cryo-Core", hintLine, true);
        }
        break;

      case "r3-door":
        if (isCurrentRoomAllSolved()) {
          stepThroughOpenDoor();
        } else {
          flashFeedbackToast("🔒 Locked — Solve all puzzles to escape");
        }
        break;
    }

    callbacks.onObjectInteract?.(objectId, "interact");
    renderState();
  }

  function submitPasscode() {
    const entered = codeInput?.value.trim() ?? "";

    if (state.difficulty === "basic") {
      if (entered === "1998") {
        state.codeEntered = true;
        if (isCurrentRoomAllSolved()) {
          state.doorUnlocked = true;
          inspectorModal?.classList.add("hidden");
          flashFeedbackToast("🔓 Door opened!");
        } else if (passcodeAlertEl) {
          passcodeAlertEl.innerHTML =
            `<div class="tle-modal-alert tle-modal-alert-error">` +
            `🔒 Solve all puzzles in the room to unseal the door!</div>`;
        }
      } else if (passcodeAlertEl) {
        passcodeAlertEl.innerHTML =
          `<div class="tle-modal-alert tle-modal-alert-error">❌ Wrong code</div>`;
      }
    } else if (state.difficulty === "hard") {
      if (entered === "2026") {
        state.r3CoreUnlocked = true;
        if (isCurrentRoomAllSolved()) {
          state.doorUnlocked = true;
          inspectorModal?.classList.add("hidden");
          flashFeedbackToast("🔓 Airlock opened!");
        } else if (passcodeAlertEl) {
          passcodeAlertEl.innerHTML =
            `<div class="tle-modal-alert tle-modal-alert-error">` +
            `🔒 Solve all puzzles in the room to unseal the airlock!</div>`;
        }
      } else if (passcodeAlertEl) {
        passcodeAlertEl.innerHTML =
          `<div class="tle-modal-alert tle-modal-alert-error">❌ Wrong code</div>`;
      }
    }
    renderState();
  }

  /** Brief, aesthetic "Game End" modal showing "YOU WON" / "YOU LOST" + Total Loops + Invite button. */
  function showScoreboardModal(forceLost = false) {
    if (!modalTitle || !pauseModal) return;
    const myLoops = Math.max(1, state.loopCount);
    const friendLoops = state.partnerLoopScore ?? DEFAULT_PARTNER_LOOPS[state.difficulty];
    const iWon = !forceLost && myLoops <= friendLoops;

    modalTitle.textContent = iWon ? "🏆 YOU WON" : "💀 YOU LOST";
    modalTitle.classList.toggle("tle-verdict-won", iWon);
    modalTitle.classList.toggle("tle-verdict-lost", !iWon);

    if (scoreboardBox) {
      scoreboardBox.innerHTML =
        `<div class="tle-stat-grid">` +
        `<div class="tle-stat-card ${iWon ? "tle-stat-winner" : ""}">` +
        `<span class="tle-stat-name">${state.player1Name}</span>` +
        `<strong class="tle-stat-loops">${myLoops} Total Loops</strong>` +
        `</div>` +
        `<div class="tle-stat-card ${!iWon ? "tle-stat-winner" : ""}">` +
        `<span class="tle-stat-name">${state.player2Name}</span>` +
        `<strong class="tle-stat-loops">${friendLoops} Total Loops</strong>` +
        `</div>` +
        `</div>`;
    }

    pauseModal.classList.remove("hidden");
    renderState();
  }

    window.setTimeout(() => {
      viewport?.classList.remove("vhs-glitch-rewind");
      vhsLayer?.classList.add("hidden");
    }, 400);
  }

  function renderState() {
    const viewport = container.querySelector("#game-viewport");
    const timerVal = container.querySelector("#hud-timer-val");
    const timerProgress = container.querySelector("#hud-timer-progress");
    const loopVal = container.querySelector("#hud-loop");

    const camLabelEl = container.querySelector("#hud-cam-label");

    const p2NameEl = container.querySelector("#hud-p2-name");
    const startRestartBtn = container.querySelector("#btn-start-restart");
    const stopBtn = container.querySelector("#btn-stop-loop");

    const isUrgent = state.timeLeftSeconds < 15 && state.timerRunning;
    const isFrostDecay =
      state.difficulty === "medium" && state.timeLeftSeconds <= 30 && state.timerRunning;
    const isGravityWarp =
      state.difficulty === "hard" && state.timeLeftSeconds <= 15 && state.timerRunning;
    const isPopupOpen =
      !loopEndModal?.classList.contains("hidden") ||
      !pauseModal?.classList.contains("hidden") ||
      !readyLobbyModal?.classList.contains("hidden") ||
      !countdownOverlay?.classList.contains("hidden");

    rootEl?.setAttribute("data-room-diff", state.difficulty);
    rootEl?.classList.toggle("room-1-office", state.difficulty === "basic");
    rootEl?.classList.toggle("room-2-cryolab", state.difficulty === "medium");
    rootEl?.classList.toggle("room-3-quantum", state.difficulty === "hard");
    rootEl?.classList.toggle("tle-lamp-off", !state.lampOn);
    blurTarget?.classList.toggle("tle-room-blurred", Boolean(isPopupOpen));
    viewport?.classList.toggle("emergency-strobe", isUrgent);
    viewport?.classList.toggle("frost-decay", isFrostDecay);
    viewport?.classList.toggle("gravity-warp", isGravityWarp);

    if (timerProgress) {
      const pct = Math.max(0, Math.min(100, (state.timeLeftSeconds / state.loopDurationSeconds) * 100));
      timerProgress.style.width = `${pct}%`;
      timerProgress.classList.toggle("tle-prog-urgent", isUrgent);
    }

    if (camLabelEl) {
      camLabelEl.textContent =
        state.difficulty === "basic"
          ? "ROOM_CAM_04 // ANOMALY DETECTED"
          : state.difficulty === "medium"
            ? "ROOM_CAM_05 // CRYO-CONTAINMENT"
            : "ROOM_CAM_06 // SINGULARITY CORE";
    }

    sceneBasic?.classList.toggle("hidden", state.difficulty !== "basic");
    sceneMedium?.classList.toggle("hidden", state.difficulty !== "medium");
    sceneHard?.classList.toggle("hidden", state.difficulty !== "hard");

    for (const dBtn of diffButtons) {
      dBtn.classList.toggle("tle-diff-active", dBtn.dataset.diff === state.difficulty);
    }

    if (timerVal) {
      timerVal.textContent = formatTime(state.timeLeftSeconds);
    }
    if (loopVal) {
      loopVal.textContent = `LOOP #${String(state.loopCount).padStart(2, "0")}`;
    }
    if (roomIndEl) {
      roomIndEl.textContent = ROOM_TITLES[state.difficulty];
    }
    if (p1NameEl) {
      p1NameEl.textContent = state.player1Name;
    }
    if (p2NameEl) {
      p2NameEl.textContent = state.player2Name;
    }

    // Minimal Lobby Ready / Not Ready state
    lobbyP1Box?.classList.toggle("tle-lobby-box-ready", state.player1Ready);
    lobbyP2Box?.classList.toggle("tle-lobby-box-ready", state.player2Ready);
    if (toggleP1ReadyBtn) {
      toggleP1ReadyBtn.textContent = state.player1Ready ? "Ready" : "Not Ready";
      toggleP1ReadyBtn.classList.toggle("tle-ready-active", state.player1Ready);
    }
    if (toggleP2ReadyBtn) {
      toggleP2ReadyBtn.textContent = state.player2Ready ? "Ready" : "Not Ready";
      toggleP2ReadyBtn.classList.toggle("tle-ready-active", state.player2Ready);
    }
    const bothReady = state.player1Ready && state.player2Ready;
    if (hostStartMatchBtn) {
      hostStartMatchBtn.disabled = !bothReady;
    }
    if (lobbyWaitHint) {
      lobbyWaitHint.textContent = bothReady ? "" : "Player not ready";
    }

    if (startRestartBtn) {
      if (state.loopExpired || state.timeLeftSeconds <= 0) {
        startRestartBtn.textContent = "↺ Restart";
        startRestartBtn.classList.add("tle-ctrl-restart-mode");
        startRestartBtn.disabled = false;
      } else if (state.timerRunning) {
        startRestartBtn.textContent = "▶ Running";
        startRestartBtn.classList.remove("tle-ctrl-restart-mode");
        startRestartBtn.disabled = true;
      } else if (state.timeLeftSeconds < state.loopDurationSeconds) {
        startRestartBtn.textContent = "▶ Resume";
        startRestartBtn.classList.remove("tle-ctrl-restart-mode");
        startRestartBtn.disabled = false;
      } else {
        startRestartBtn.textContent = "▶ Start";
        startRestartBtn.classList.remove("tle-ctrl-restart-mode");
        startRestartBtn.disabled = false;
      }
    }
    if (stopBtn) {
      stopBtn.disabled = !state.timerRunning;
    }

    const allSolved = isCurrentRoomAllSolved();
    if (allSolved) {
      state.doorUnlocked = true;
    }

    // Room 1 visual states
    const paintingBtn = container.querySelector("#obj-painting");
    const keyBtn = container.querySelector("#obj-key");
    paintingBtn?.classList.toggle("tle-painting-open", state.keyRevealed);
    keyBtn?.classList.toggle("hidden", !state.keyRevealed || state.keyCollected);

    const cabinetBtn = container.querySelector("#obj-cabinet");
    const cabinetBadge = container.querySelector("#state-cabinet");
    cabinetBtn?.classList.toggle("tle-cabinet-open", state.cabinetUnlocked);
    if (cabinetBadge) {
      cabinetBadge.textContent = state.cabinetUnlocked ? "🔓" : "🔒";
    }

    const monitorScreen = container.querySelector("#monitor-screen");
    const monitorLock = container.querySelector("#state-computer");
    const monitorPassbox = container.querySelector("#monitor-passbox");
    monitorScreen?.classList.toggle("tle-monitor-unlocked", state.codeEntered);
    if (monitorLock) {
      monitorLock.textContent = state.codeEntered ? "🔓" : "🔒";
    }
    if (monitorPassbox) {
      monitorPassbox.textContent = state.codeEntered ? "OPEN" : "* * * *";
    }

    const doorBtn = container.querySelector("#obj-door");
    const r1Open = state.difficulty === "basic" && allSolved;
    doorBtn?.classList.toggle("tle-door-swung-open", r1Open);

    // Room 2 visual states
    const r2DoorBtn = container.querySelector("#r2-door-btn");
    const r2Open = state.difficulty === "medium" && allSolved;
    r2DoorBtn?.classList.toggle("tle-door-swung-open", r2Open);

    // Room 3 visual states
    const r3DoorBtn = container.querySelector("#r3-door-btn");
    const r3Open = state.difficulty === "hard" && allSolved;
    r3DoorBtn?.classList.toggle("tle-door-swung-open", r3Open);

    // Inventory Slots
    const invContainer = container.querySelector("#inventory-list");
    if (invContainer) {
      const slotsHtml[] = [];
      for (let i = 0; i < 4; i++) {
        const item = state.inventory[i];
        if (item) {
          const isEquipped = state.activeItem === item;
          slotsHtml.push(
            `<button type="button" class="tle-inv-slot tle-inv-slot-filled ${
              isEquipped ? "tle-inv-slot-active" : ""
            }" data-inv-item="${item}" title="${item}">` +
              renderSlotItemSvg(item) +
              `</button>`,
          );
        } else {
          slotsHtml.push(`<div class="tle-inv-slot"></div>`);
        }
      }
      invContainer.innerHTML = slotsHtml.join("");
    }

    // Persistent Clues
    const cluesList = container.querySelector("#clues-list");
    if (cluesList) {
      if (state.clues.length === 0) {
        const defaultHint =
          state.difficulty === "basic"
            ? "Inspect the open journal on the desk..."
            : state.difficulty === "medium"
              ? "Inspect the brass Gramophone on the left for the first riddle..."
              : "Inspect the left Power Grid schematic to start...";
        cluesList.innerHTML = `<li class="tle-clue-empty">${defaultHint}</li>`;
      } else {
        cluesList.innerHTML = state.clues
          .map((clue) => `<li class="tle-clue-item">${clue}</li>`)
          .join("");
      }
    }
  }

  function update(partialState) {
    const prevTime = state.timeLeftSeconds;
    state = {
      ...state,
      ...partialState,
      clues: partialState.clues ? [...partialState.clues] : state.clues,
      inventory: partialState.inventory ? [...partialState.inventory] : state.inventory,
    };

    if (
      partialState.timeLeftSeconds !== undefined &&
      partialState.timeLeftSeconds <= 0 &&
      prevTime > 0 &&
      !state.escaped
    ) {
      expireLoop();
      return;
    }

    renderState();
  }

  renderState();

  const viewportElement = container.querySelector("#game-viewport") ?? container;
  const dockElement = container.querySelector("#inventory-clues-dock") ?? container;

  return {
    update,
    resetLoop,
    getState: () => ({ ...state }),
    viewportElement,
    dockElement,
  };
}


const root = document.getElementById("app");
renderGameScreen(root, {
  roomId: "ROOM 01 // OFFICE",
  timeLeftSeconds: 60,
  loopDurationSeconds: 60,
  loopCount: 4,
  connectedPlayers: 2,
  player1Name: "You",
  player2Name: "Drek"
});
  </script>
</body>
