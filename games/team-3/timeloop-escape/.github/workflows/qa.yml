name: QA
on: workflow_dispatch # manual only: Zaid runs it after integrating (gh workflow run QA)
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test.html in headless Chrome
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=30000 \
            --dump-dom "file://$PWD/test.html" > out.html
          grep -oE '(PASS|FAIL) [^<]*' out.html || true
          grep -q '>ALL PASS<' out.html
